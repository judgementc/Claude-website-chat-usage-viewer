<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 370px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: #f5f4ef;
      color: #1a1a1a;
      -webkit-font-smoothing: antialiased;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e8e5de;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: linear-gradient(135deg, #D97706, #B45309);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 700;
      font-size: 12px;
    }

    .title {
      font-size: 15px;
      font-weight: 600;
      color: #1a1a1a;
      letter-spacing: -0.2px;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #8b8680;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      flex-shrink: 0;
    }

    .status-dot.error {
      background: #ef4444;
    }

    .status-dot.loading {
      background: #f59e0b;
      animation: pulse 1.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Error Message */
    .error-msg {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 12px;
      color: #dc2626;
      margin-bottom: 12px;
      display: none;
      line-height: 1.4;
    }

    .error-msg.show {
      display: block;
    }

    /* Card Styles */
    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 10px;
      border: 1px solid #e8e5de;
      transition: box-shadow 0.2s ease;
    }

    .card:hover {
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 13px;
      font-weight: 600;
      color: #1a1a1a;
      line-height: 1.3;
    }

    .card-subtitle {
      font-size: 11px;
      color: #8b8680;
      margin-top: 2px;
      font-weight: 400;
    }

    .card-badge {
      font-size: 11px;
      color: #8b8680;
      background: #f5f4ef;
      padding: 3px 8px;
      border-radius: 6px;
      white-space: nowrap;
      font-weight: 500;
    }

    /* Circular Progress Ring */
    .ring-container {
      display: flex;
      align-items: center;
      gap: 20px;
      margin: 4px 0;
    }

    .ring-wrap {
      position: relative;
      width: 80px;
      height: 80px;
      flex-shrink: 0;
    }

    .ring-svg {
      transform: rotate(-90deg);
      width: 80px;
      height: 80px;
    }

    .ring-bg {
      fill: none;
      stroke: #e8e5de;
      stroke-width: 6;
    }

    .ring-fill {
      fill: none;
      stroke: #22c55e;
      stroke-width: 6;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.6s ease, stroke 0.4s ease;
    }

    .ring-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }

    .ring-percent {
      font-size: 20px;
      font-weight: 700;
      color: #1a1a1a;
      line-height: 1;
    }

    .ring-label {
      font-size: 9px;
      color: #8b8680;
      margin-top: 2px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .ring-info {
      flex: 1;
      min-width: 0;
    }

    .countdown-value {
      font-size: 22px;
      font-weight: 700;
      color: #1a1a1a;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.5px;
      line-height: 1.2;
    }

    .countdown-label {
      font-size: 11px;
      color: #8b8680;
      margin-bottom: 4px;
      font-weight: 500;
    }

    .reset-time-text {
      font-size: 11px;
      color: #a8a29e;
      margin-top: 6px;
    }

    /* Linear Progress Bar */
    .progress-section {
      margin: 8px 0;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 8px;
    }

    .progress-amount {
      font-size: 18px;
      font-weight: 700;
      color: #1a1a1a;
    }

    .progress-limit {
      font-size: 13px;
      color: #8b8680;
      font-weight: 500;
    }

    .progress-bar-track {
      background: #e8e5de;
      border-radius: 100px;
      height: 8px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar-fill {
      height: 100%;
      border-radius: 100px;
      background: linear-gradient(90deg, #D97706, #B45309);
      transition: width 0.6s ease;
      min-width: 2px;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
      font-size: 11px;
      color: #8b8680;
    }

    /* Billing Section */
    .billing-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
    }

    .billing-row + .billing-row {
      border-top: 1px solid #f0ede6;
    }

    .billing-label {
      font-size: 12px;
      color: #8b8680;
    }

    .billing-value {
      font-size: 14px;
      font-weight: 600;
      color: #1a1a1a;
    }

    .billing-tag {
      font-size: 10px;
      color: #22c55e;
      background: #f0fdf4;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 500;
      margin-left: 6px;
    }

    /* Actions */
    .actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    .btn {
      flex: 1;
      padding: 9px 14px;
      border: 1px solid #e8e5de;
      border-radius: 8px;
      background: #ffffff;
      color: #1a1a1a;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.15s ease;
      text-align: center;
      font-family: inherit;
    }

    .btn:hover {
      background: #f5f4ef;
      border-color: #d6d3cc;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn.primary {
      background: #D97706;
      border-color: #D97706;
      color: #fff;
    }

    .btn.primary:hover {
      background: #B45309;
      border-color: #B45309;
    }

    /* Footer */
    .footer {
      margin-top: 10px;
      text-align: center;
      font-size: 10px;
      color: #a8a29e;
    }

    /* Hidden utility */
    .hidden {
      display: none !important;
    }

    /* Skeleton loading */
    .skeleton {
      background: linear-gradient(90deg, #e8e5de 25%, #f0ede6 50%, #e8e5de 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 4px;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <div class="logo">C</div>
      <div class="title">Claude Usage</div>
    </div>
    <div class="status-indicator">
      <div class="status-dot loading" id="statusDot"></div>
      <span id="statusText">Loading</span>
    </div>
  </div>

  <!-- Error -->
  <div class="error-msg" id="error"></div>

  <!-- 1. Plan Usage Limits -->
  <div class="card" id="planUsageCard">
    <div class="card-header">
      <div>
        <div class="card-title">Plan usage limits</div>
        <div class="card-subtitle">Current session</div>
      </div>
      <div class="card-badge" id="resetBadge">--</div>
    </div>
    <div class="ring-container">
      <div class="ring-wrap">
        <svg class="ring-svg" viewBox="0 0 80 80">
          <circle class="ring-bg" cx="40" cy="40" r="34" />
          <circle class="ring-fill" id="ringFill" cx="40" cy="40" r="34"
            stroke-dasharray="213.63"
            stroke-dashoffset="213.63" />
        </svg>
        <div class="ring-text">
          <div class="ring-percent" id="ringPercent">--%</div>
          <div class="ring-label">used</div>
        </div>
      </div>
      <div class="ring-info">
        <div class="countdown-label">Resets in</div>
        <div class="countdown-value" id="countdown">--:--:--</div>
        <div class="reset-time-text" id="resetTime"></div>
      </div>
    </div>
  </div>

  <!-- 2. Extra Usage -->
  <div class="card hidden" id="extraUsageCard">
    <div class="card-header">
      <div>
        <div class="card-title">Extra usage</div>
        <div class="card-subtitle" id="extraSubtitle"></div>
      </div>
      <div class="card-badge" id="extraResetBadge">--</div>
    </div>
    <div class="progress-section">
      <div class="progress-header">
        <div class="progress-amount" id="extraSpent">--</div>
        <div class="progress-limit" id="extraLimit">--</div>
      </div>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="extraFill" style="width: 0%"></div>
      </div>
      <div class="progress-meta">
        <span id="extraPercent">-- used</span>
        <span id="extraResetDate">--</span>
      </div>
    </div>
  </div>

  <!-- 3. Monthly Spending Limit -->
  <div class="card hidden" id="billingCard">
    <div class="card-header">
      <div>
        <div class="card-title">Monthly spending limit</div>
      </div>
    </div>
    <div class="billing-row">
      <span class="billing-label">Current balance</span>
      <span>
        <span class="billing-value" id="billingBalance">--</span>
        <span class="billing-tag hidden" id="autoReloadTag">auto-reload on</span>
      </span>
    </div>
    <div class="billing-row">
      <span class="billing-label">Spending limit</span>
      <span class="billing-value" id="billingLimit">--</span>
    </div>
  </div>

  <!-- Actions -->
  <div class="actions">
    <button class="btn primary" id="refreshBtn">Refresh</button>
    <button class="btn" id="openClaudeBtn">Open Claude</button>
    <button class="btn" id="openSettingsBtn">Settings</button>
  </div>

  <!-- Footer -->
  <div class="footer">
    <span id="lastUpdate">Waiting for data...</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
